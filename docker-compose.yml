version: '3.8'

services:
  # Local Substrate node
  substrate-node:
    image: paritytech/substrate-node-template:latest
    container_name: landvault-substrate
    ports:
      - "9944:9944"
      - "9933:9933"
    command: >
      --dev
      --unsafe-ws-external
      --unsafe-rpc-external
      --rpc-cors all
      --alice
    volumes:
      - substrate_data:/data
    networks:
      - landvault-network

  # IPFS node for document storage
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: landvault-ipfs
    ports:
      - "4001:4001"
      - "8080:8080"
      - "5001:5001"
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - landvault-network

  # PostgreSQL for off-chain data
  postgres:
    image: postgres:15
    container_name: landvault-postgres
    environment:
      POSTGRES_DB: landvault
      POSTGRES_USER: landvault
      POSTGRES_PASSWORD: landvault123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - landvault-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: landvault-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - landvault-network

  # Event indexer and API
  indexer:
    build:
      context: .
      dockerfile: Dockerfile.indexer
    container_name: landvault-indexer
    environment:
      DATABASE_URL: postgres://landvault:landvault123@postgres:5432/landvault
      SUBSTRATE_WS: ws://substrate-node:9944
      BIND_ADDR: 0.0.0.0:8088
    depends_on:
      - postgres
      - substrate-node
    ports:
      - "8088:8088"
    networks:
      - landvault-network

volumes:
  substrate_data:
  ipfs_data:
  postgres_data:
  redis_data:

networks:
  landvault-network:
    driver: bridge
