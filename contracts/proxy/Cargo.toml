[package]
name = "landvault-proxy"
version = "1.0.0"
authors = ["LandVault Team <dev@landvault.io>"]
edition = "2021"

[dependencies]
ink = { workspace = true, features = ["std"] }
scale = { workspace = true, features = ["std"] }
scale-info = { workspace = true, features = ["std"] }

[lib]
name = "landvault_proxy"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
]
ink-as-dependency = []
