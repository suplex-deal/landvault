[package]
name = "landvault-common"
version = "1.0.0"
authors = ["LandVault Team <dev@landvault.io>"]
edition = "2021"
description = "Shared utilities for LandVault contracts (transaction-scoped caching)"
license = "MIT"
homepage = "https://landvault.io"
repository = "https://github.com/MettaChain/LandVault-contract"
publish = false

[dependencies]
ink = { workspace = true, default-features = false }
scale = { workspace = true, default-features = false }

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
]
ink-as-dependency = []
