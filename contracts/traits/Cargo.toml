[package]
name = "landvault-traits"
version = "1.0.0"
authors = ["LandVault Team <dev@landvault.io>"]
edition = "2021"
publish = false

[dependencies]
ink = { workspace = true, default-features = false }
scale = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }

[lib]
name = "landvault_traits"
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.secp256k1]
version = "0.33.1"
features = ["recovery"]
