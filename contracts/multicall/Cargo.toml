[package]
name = "landvault-multicall"
version = "1.0.0"
authors = ["LandVault Team <dev@landvault.io>"]
edition = "2021"
publish = false

[dependencies]
ink = { workspace = true, default-features = false }
scale = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
landvault-traits = { path = "../traits", default-features = false }

[lib]
name = "landvault_multicall"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "landvault-traits/std",
]
ink-as-dependency = []
