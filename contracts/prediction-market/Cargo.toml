[package]
name = "landvault-prediction-market"
version = "1.0.0"
authors = ["LandVault Team <dev@landvault.io>"]
edition = "2021"

[dependencies]
ink = { workspace = true }
scale = { workspace = true }
scale-info = { workspace = true }
landvault-traits = { path = "../traits", default-features = false }
landvault-contracts = { path = "../lib", default-features = false }

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "landvault-traits/std",
    "landvault-contracts/std",
]
ink-as-dependency = []
