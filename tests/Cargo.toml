[package]
name = "landvault-tests"
version = "1.0.0"
authors = ["LandVault Team <dev@landvault.io>"]
edition = "2021"
publish = false

[lib]
name = "landvault_tests"
path = "lib.rs"

[dependencies]
# ink! dependencies
ink = { version = "5.0.0", default-features = false }
scale = { package = "parity-scale-codec", version = "3.6.9", default-features = false, features = ["derive"] }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }

# Testing dependencies
ink_e2e = { version = "5.0.0", optional = true }
ink_env = { version = "5.0.0", default-features = false }

# Contract dependencies
landvault-traits = { path = "../contracts/traits", default-features = false }
landvault-contracts = { path = "../contracts/lib", default-features = false }
landvault-monitoring = { path = "../contracts/monitoring", default-features = false, features = ["ink-as-dependency"] }
compliance_registry = { path = "../contracts/compliance_registry", default-features = false }

# Issue #488 / #487 / #489: contract crates needed for new test modules
governance = { path = "../contracts/governance", default-features = false }
staking = { path = "../contracts/staking", default-features = false }
landvault-bridge = { path = "../contracts/bridge", default-features = false }
oracle = { path = "../contracts/oracle", default-features = false }
landvault-insurance = { path = "../contracts/insurance", default-features = false }
fractional = { path = "../contracts/fractional", default-features = false }
# Issues #926 / #927: batching and prediction-market coverage targets
landvault-multicall = { path = "../contracts/multicall", default-features = false }
landvault-prediction-market = { path = "../contracts/prediction-market", default-features = false }

# Issue #1013: third-party registry integration coverage
landvault-third-party = { path = "../contracts/third-party", default-features = false }

# Issue #1010: mock oracle integration coverage (no "mock" feature — prices
# must come from explicit pushes only)
mock-oracle = { path = "../contracts/mock-oracle", default-features = false }

# Issue #1005 / #1006 / #1007: contract crates needed for new test modules
landvault-gdpr = { path = "../contracts/gdpr", default-features = false }
landvault-factory = { path = "../contracts/factory", default-features = false }
ipfs-metadata = { path = "../contracts/ipfs-metadata", default-features = false }

# Issue: version-registry integration coverage (paired with the factory, the
# deployment/upgrade flow the registry exists to track)
version-registry = { path = "../contracts/version-registry", default-features = false }

# Issue #1004: on-chain sanctions screening contract
landvault-sanctions = { path = "../contracts/sanctions", default-features = false }

# Issues #918-#925: contracts under integration test
landvault-dex = { path = "../contracts/dex", default-features = false }
landvault-lending = { path = "../contracts/lending", default-features = false }
landvault-crowdfunding = { path = "../contracts/crowdfunding", default-features = false }
property-management = { path = "../contracts/property-management", default-features = false }
landvault-fees = { path = "../contracts/fees", default-features = false }
landvault-analytics = { path = "../contracts/analytics", default-features = false }
landvault-database = { path = "../contracts/database", default-features = false }
landvault-identity = { path = "../contracts/identity", default-features = false }

# Async runtime
tokio = { version = "1.0", features = ["full"], optional = true }

# Utilities
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
rand = "0.9"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
landvault-contracts = { path = "../contracts/lib", default-features = false }
compliance_registry = { path = "../contracts/compliance_registry", default-features = false }
proptest = { version = "1.4", features = ["std"] }

# The package root is this tests/ directory, so cargo cannot auto-discover
# integration test files — each suite must be declared explicitly.
[[test]]
name = "integration_multicall"
path = "integration_multicall.rs"

[[test]]
name = "integration_prediction_market"
path = "integration_prediction_market.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "landvault-contracts/std",
    "landvault-monitoring/std",
    "governance/std",
    "staking/std",
    "landvault-bridge/std",
    "landvault-insurance/std",
    "fractional/std",
    "landvault-multicall/std",
    "landvault-prediction-market/std",
    "landvault-third-party/std",
    "mock-oracle/std",
    "compliance_registry/std",
    "landvault-gdpr/std",
    "landvault-factory/std",
    "ipfs-metadata/std",
    "version-registry/std",
    "landvault-sanctions/std",
    "landvault-dex/std",
    "landvault-lending/std",
    "landvault-crowdfunding/std",
    "property-management/std",
    "landvault-fees/std",
    "landvault-analytics/std",
    "landvault-database/std",
    "landvault-identity/std",
    "serde/std",
    "serde_json/std",
    "tokio",
]
e2e-tests = ["std", "ink_e2e"]
security-tests = ["std"]
disabled_test = []




# Issues #918-#925: explicit integration-test targets (the package root is
# the tests/ directory itself, so cargo cannot auto-discover test files)
[[test]]
name = "integration_dex"
path = "integration_dex.rs"

[[test]]
name = "integration_lending"
path = "integration_lending.rs"

[[test]]
name = "integration_crowdfunding"
path = "integration_crowdfunding.rs"

[[test]]
name = "integration_property_management"
path = "integration_property_management.rs"

[[test]]
name = "integration_database"
path = "integration_database.rs"

[[test]]
name = "integration_fees"
path = "integration_fees.rs"

[[test]]
name = "integration_analytics"
path = "integration_analytics.rs"

[[test]]
name = "integration_identity"
path = "integration_identity.rs"

[[test]]
name = "integration_insurance"
path = "integration_insurance.rs"

[[test]]
name = "integration_monitoring_sanctions"
path = "integration_monitoring_sanctions.rs"
