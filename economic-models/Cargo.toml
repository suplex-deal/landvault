[package]
name = "landvault-economic-models"
version = "1.0.0"
authors = ["LandVault Team <dev@landvault.io>"]
edition = "2021"
description = "Models of LandVault's value-movement arithmetic (lending rate, fee rounding, staking reward points), with Kani proof harnesses"
license = "MIT"
homepage = "https://landvault.io"
repository = "https://github.com/MettaChain/LandVault-contract"
publish = false

[lib]
name = "landvault_economic_models"
path = "src/lib.rs"
crate-type = ["rlib"]

# Deliberately dependency-free: this crate is compiled by Kani in CI, and a
# dependency tree here would be a dependency tree the proofs have to trust.
[dependencies]

[features]
default = []
